task_id: S10
title: 变频器故障码分级报警
difficulty: easy
category: D
requirement: |-
  变频器通过故障码上报状态，需要按严重程度分级处理。

  控制要求：
  1. VFDFaultCode = 16#0001 为轻故障：只点亮 AlarmLamp，不跳闸，VFDRun 保持。
  2. VFDFaultCode = 16#0002 或 16#0003 为重故障：立即置 TripOutput = TRUE，AlarmLamp = TRUE，并锁存故障码。
  3. 重故障锁存后，即使 VFDFaultCode 恢复为 16#0000 也不得自动复位；必须 ResetBtn 上升沿且当前无故障才解除 TripOutput。
  4. 运行中（VFDRun = TRUE）出现任何非零故障码时，TripOutput 立即为 TRUE。
  5. Status 输出当前生效的故障码（16#0000 表示无故障）。
  6. 上电时 TripOutput = FALSE、AlarmLamp = FALSE、Status = 16#0000。

  扫描周期：20 ms（全组统一，见 docs/tasks_note.md）
io_table:
  - direction: IN
    name: VFDFaultCode
    data_type: WORD
    description: 变频器故障码
  - direction: IN
    name: VFDRun
    data_type: BOOL
    description: 变频器运行反馈
  - direction: IN
    name: ResetBtn
    data_type: BOOL
    description: 复位按钮（上升沿有效）
  - direction: OUT
    name: AlarmLamp
    data_type: BOOL
    description: 报警灯
  - direction: OUT
    name: TripOutput
    data_type: BOOL
    description: 跳闸输出
  - direction: OUT
    name: Status
    data_type: WORD
    description: 当前生效故障码
initial_state: "AlarmLamp = FALSE；TripOutput = FALSE；Status = 16#0000；ResetBtnLast = FALSE；锁存故障码 = 16#0000。"
constraints:
  - K1 重故障必须在同一周期内置 TripOutput。
  - K2 重故障锁存，故障码消失后不自动复位。
  - K3 复位只在 ResetBtn 上升沿且当前无故障时生效。
  - K4 VFDRun = TRUE 且故障码非零时 TripOutput 立即为 TRUE。
provenance: 改编自公开题（P03 Alarm Handling（课程题库））；改编点：把「模拟量滞回报警」换成「故障码分级 + 锁存 + 复位」，滞回改为分级判据；为什么这样改：现场报警管理的核心不是阈值而是「分级 + 锁存 + 复位条件」，原题的滞回结构正好可以平移成三档判据；来源与审核记录见 data/provenance.csv 第 31 行
spec_ref: data/specs/S10.ltl
error_examples:
  - 错误实现：TripOutput := (VFDFaultCode <> 0)。症状——故障码自己消失后跳闸自动复位，设备在无人确认下重新启动。
  - 错误实现：复位用 ResetBtn 电平。症状——按住复位按钮时故障每周期被清掉又重现。
notes: ""
